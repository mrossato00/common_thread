{% extends "base.html" %}

{% block title %}{{ name }} · Common Thread{% endblock %}

{% block content %}
  <p><a href="{{ url_for('index') }}">← All works</a></p>

  <h1>{{ name }}</h1>

  <ul>
    {% for w in works %}
      <li>
        <a href="{{ url_for('work', slug=w.slug) }}">{{ w.title }}</a>
        ({{ w.type }}, {{ w.year }})
      </li>
    {% endfor %}
  </ul>
{% endblock %}
