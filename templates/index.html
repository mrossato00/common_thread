{% extends "base.html" %}

{% block title %}Common Thread{% endblock %}

{% block content %}
  <h1>Common Thread</h1>

  <p>{{ works|length }} works</p>

  <ul>
    {% for w in works %}
      <li>
        <a href="{{ url_for('work', slug=w.slug) }}">{{ w.title }}</a>
        ({{ w.type|replace("_", " ") }}, {{ w.year }})
      </li>
    {% else %}
      <li>No works found.</li>
    {% endfor %}
  </ul>
{% endblock %}
