<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Common Thread{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Common Thread</a>

    <nav>
      {% for t in nav_types %}
        <a href="{{ url_for('index', type=t.type) }}"
           {% if request.endpoint == 'index' and request.args.get('type') == t.type %}class="active"{% endif %}>
          {{ t.type|replace("_", " ") }}
        </a>
      {% endfor %}
    </nav>

    <form method="get" action="{{ url_for('index') }}">
      <input type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="Search by title or type">
    </form>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
